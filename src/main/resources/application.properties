spring.application.name=lares-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:lares}
spring.datasource.password=${DB_PASSWORD:lares}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

app.jwt.secret=${JWT_SECRET}

spring.rabbitmq.addresses=${RABBITMQ_URL:}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.triagem.base-url=${TRIAGEM_BASE_URL:http://localhost:8000}
app.triagem.api-key=${TRIAGEM_API_KEY:}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

management.endpoints.web.exposure.include=health
