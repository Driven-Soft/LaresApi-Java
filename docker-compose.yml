services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_URL: ${DB_URL:-jdbc:oracle:thin:@host.docker.internal:1521/FREEPDB1}
      DB_USERNAME: ${DB_USERNAME:?Configure DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-lares}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Configure RABBITMQ_DEFAULT_PASS in .env}
      TRIAGEM_BASE_URL: ${TRIAGEM_BASE_URL:-http://host.docker.internal:8000}
      TRIAGEM_API_KEY: ${TRIAGEM_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-lares}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Configure RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq-data:
