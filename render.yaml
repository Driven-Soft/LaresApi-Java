services:
  - type: web
    name: lares-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /actuator/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TZ
        value: America/Sao_Paulo
      - key: TRIAGEM_BASE_URL
        sync: false
      - key: TRIAGEM_API_KEY
        sync: false
